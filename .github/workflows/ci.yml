name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack -c Release --no-build -o ./artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

  publish-nuget:
    name: Publish NuGet
    needs: build-test-pack
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/packages

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jkljajic

      - name: Publish to NuGet.org (Trusted Publishing)
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem ./artifacts/packages -Recurse -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in ./artifacts/packages"
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --source "https://api.nuget.org/v3/index.json" `
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
              --skip-duplicate `
               --no-symbols
          }

      - name: Publish to GitHub Packages
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem ./artifacts/packages -Recurse -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found in ./artifacts/packages"
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
              --api-key "${{ secrets.GITHUB_TOKEN }}" `
              --skip-duplicate `
               --no-symbols
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
